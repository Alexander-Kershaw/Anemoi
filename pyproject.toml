[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anemoi"
version = "0.1.0"
description = "Meteorological portfolio combining data engineering, ML, and visualization"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Alexander James Kershaw" }
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14.0",
  "matplotlib>=3.8",
  "meteostat>=1.6",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

